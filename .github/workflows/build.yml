name: Build CarWidget

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.build_variant }})
    # macOS runners are not offered to this account ("macos-14-arm64-us-default is not
    # supported"), so the package is cross-compiled on Linux with build-linux.sh.
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.bump.outputs.package_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_variant: rootless
          # - build_variant: rootful
          # - build_variant: roothide

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm make git curl ca-certificates dpkg-dev fakeroot xz-utils libplist-utils

      - name: Bump Package Version
        id: bump
        run: |
          VERSION="1.0.0-${{ github.run_number }}"
          echo "Using version: $VERSION"
          sed -i "s/^Version: .*/Version: ${VERSION}/" control
          echo "package_version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Package
        run: |
          sudo chmod 0755 layout/DEBIAN/postinst layout/DEBIAN/postrm build-linux.sh
          sh build-linux.sh "${{ matrix.build_variant }}"
          export THEOS="$PWD/.axs-toolchain/theos" PATH=/usr/bin:$PATH
          make package THEOS_PACKAGE_SCHEME="${{ matrix.build_variant }}" \
            FORCE_PACKAGE_NAME=yes PACKAGE_BUILDNAME="${{ matrix.build_variant }}"
          echo "=== .deb files ==="
          find ./packages -name "*.deb" -type f

      - name: Inspect Package
        run: |
          for deb in ./packages/*.deb; do
            dpkg-deb -I "$deb"
            dpkg-deb -c "$deb"
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.build_variant }}
          path: ./packages/*.deb
          if-no-files-found: error

      - name: Create Release
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: v${{ steps.bump.outputs.package_version }}
          name: "CarPlay 小组件 v${{ steps.bump.outputs.package_version }}"
          body: |
            Airaw 模块式 CarPlay 组件（时间 + 日期 + 天气，Open-Meteo 联网取天气）。
            安装后在 Airaw → 添加小部件 → 添加，选择“时间天气”。
            兼容 arm64 / arm64e，iOS 15+，rootless。
          files: ./packages/*.deb
